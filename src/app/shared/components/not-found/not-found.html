<div class="min-h-screen flex items-center justify-center bg-background p-4">
  <div class="text-center space-y-6 max-w-md">
    <!-- 404 -->
    <div class="relative">
      <h1 class="text-[150px] font-bold text-muted-foreground/20 leading-none select-none">404</h1>
    </div>

    <!-- Mensaje -->
    <div class="space-y-2">
      <h2 class="text-2xl font-bold tracking-tight">Pagina no encontrada</h2>
      <p class="text-muted-foreground">
        Lo sentimos, la pagina que estas buscando no existe o ha sido movida.
      </p>
    </div>

    <!-- Actions -->
    <div class="flex flex-col sm:flex-row items-center justify-center gap-3 pt-4">
      <a [routerLink]="dashboardUrl" z-button zType="default" class="cursor-pointer">
        <ng-icon name="lucideHome" class="mr-2 h-4 w-4" />
        Ir al Tablero
      </a>
      <button type="button" z-button zType="outline" class="cursor-pointer" (click)="volverAtras()">
        <ng-icon name="lucideArrowLeft" class="mr-2 h-4 w-4" />
        Volver atras
      </button>
    </div>

    <!-- Helper text -->
    <p class="text-sm text-muted-foreground pt-4">
      Si crees que esto es un error, contacta al administrador.
    </p>
  </div>
</div>
