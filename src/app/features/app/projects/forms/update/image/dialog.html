<form [formGroup]="form" (ngSubmit)="handleSubmitImages()" class="grid gap-6">
  <div class="flex flex-col gap-3">
    <z-form-field>
      <label
        for="altText"
        class="flex items-center gap-2 text-sm leading-none font-medium select-none group-data-[disabled=true]:pointer-events-none group-data-[disabled=true]:opacity-50 peer-disabled:cursor-not-allowed peer-disabled:opacity-50"
        z-form-label
        zRequired>
        Alt Titulo
      </label>
      <z-form-control>
        <input
          z-input
          id="altText"
          formControlName="altText"
          placeholder="Alt Titulo"
          [zStatus]="altTextControl?.invalid && altTextControl!.touched ? 'error' : undefined"
          zRequired
          class="outFocus file:text-foreground placeholder:text-muted-foreground selection:bg-primary selection:text-primary-foreground dark:bg-input/30 border-input focus-visible:border-ring focus-visible:ring-ring/50 aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 aria-invalid:border-destructive flex h-9 w-full min-w-0 rounded-md border bg-transparent px-3 py-1 text-base shadow-xs transition-[color,box-shadow] outline-none file:inline-flex file:h-7 file:border-0 file:bg-transparent file:text-sm file:font-medium focus-visible:ring-[3px] disabled:pointer-events-none disabled:cursor-not-allowed disabled:opacity-50 md:text-sm" />
      </z-form-control>
      <z-form-message zType="error">{{ getAltTextError() }}</z-form-message>
    </z-form-field>
  </div>

  <div class="">
    @if (coverImage()) {
      <div class="relative">
        <img
          [src]="coverImage()"
          alt="Cover"
          class="w-full aspect-video object-contain rounded-lg" />
        <button
          (click)="removeCoverImage()"
          class="absolute top-2 right-2 h-8 w-8 cursor-pointer"
          z-button
          zSize="icon"
          type="button"
          zType="destructive">
          <ng-icon name="lucideX" class="h-4 w-4" />
        </button>
      </div>
    } @else {
      <label
        class="flex flex-col items-center justify-center w-full aspect-video border-2 border-dashed rounded-lg cursor-pointer hover:bg-muted/50 transition-colors">
        <ng-icon name="lucideUpload" class="h-8 w-8 text-muted-foreground mb-2" />
        <span class="text-sm text-muted-foreground">Subir imagen</span>
        <input
          type="file"
          accept="image/*"
          class="hidden"
          (change)="handleCoverImageUpload($event)" />
      </label>
    }
  </div>
  <div>
    <button
      [zDisabled]="form.invalid || !selectedCoverFile"
      z-button
      type="submit"
      zType="default"
      class="cursor-pointer flex-1 w-full md:w-auto">
      <ng-icon name="lucideUpload" class="mr-2 h-4 w-4" />
      <span>Cargar imagen</span>
    </button>
  </div>
</form>
