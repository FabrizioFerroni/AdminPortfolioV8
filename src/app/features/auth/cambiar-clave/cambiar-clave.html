<div class="min-h-screen flex items-center justify-center dark:bg-background p-4">
  <div class="w-full max-w-md">
    <div class="bg-card rounded-2xl shadow-lg border border-border p-8 space-y-6">
      <div class="flex flex-col items-center gap-4">
        <div class="bg-primary bg-primary rounded-2xl shadow-lg shadow-primary/25 p-4">
          <svg lucideBriefcase class="h-8 w-8 text-primary-foreground"></svg>
        </div>
        <div class="text-center">
          <h1 class="text-2xl font-bold text-foreground">Portfolio Admin</h1>
          <p class="text-sm text-muted-foreground mt-1">Cambiar contraseña.</p>
        </div>
      </div>
      <form
        novalidate
        [formGroup]="validationForm"
        (ngSubmit)="handleSubmit()"
        class="max-w-sm space-y-6 select-none">
        @if (authRecoverError()) {
          <z-alert
            zType="destructive"
            zTitle="Uppsss... Hubo un error!"
            [zDescription]="customDescription"
            class="animate-in slide-in-from-top-2" />

          <ng-template #customDescription>
            <p>{{ authRecoverError() }}</p>
          </ng-template>
        }

        <div class="space-y-4">
          <div class="flex flex-col gap-2">
            <z-form-field>
              <div class="flex items-center justify-between">
                <label
                  for="password"
                  id="password"
                  class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70"
                  z-form-label
                  zRequired
                  >Contraseña</label
                >
              </div>
              <div class="relative">
                <z-form-control>
                  <svg
                    lucideLock
                    class="absolute left-3 top-1/2 -translate-y-1/2 h-5 w-5 text-muted-foreground"></svg>
                  <input
                    z-input
                    type="{{ showPassword ? 'text' : 'password' }}"
                    placeholder="Ingresa tu contraseña"
                    formControlName="password"
                    id="password"
                    class="h-12 pl-10 pr-4 outFocus"
                    autoComplete="current-password"
                    zRequired
                    [zStatus]="
                      passwordControl.invalid && passwordControl.touched ? 'error' : undefined
                    " />
                  <button
                    type="button"
                    (click)="showPassword = !showPassword"
                    class="absolute right-3 top-1/2 -translate-y-1/2 text-muted-foreground hover:text-foreground transition-colors cursor-pointer">
                    @if (showPassword) {
                      <svg lucideEyeOff class="h-5 w-5"></svg>
                    } @else {
                      <svg lucideEye class="h-5 w-5"></svg>
                    }
                  </button>
                </z-form-control>
                <z-form-message zType="error">{{ getPasswordError() }}</z-form-message>
              </div>
            </z-form-field>
          </div>
          <div class="flex flex-col gap-2">
            <z-form-field>
              <div class="flex items-center justify-between">
                <label
                  for="confirm_password"
                  id="confirm_password"
                  class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70"
                  z-form-label
                  zRequired
                  >Confirmar Contraseña</label
                >
              </div>
              <div class="relative">
                <z-form-control>
                  <svg
                    lucideLock
                    class="absolute left-3 top-1/2 -translate-y-1/2 h-5 w-5 text-muted-foreground"></svg>
                  <input
                    z-input
                    type="{{ showConfirmPassword ? 'text' : 'password' }}"
                    placeholder="Confirma tu contraseña"
                    formControlName="confirm_password"
                    id="confirm_password"
                    class="h-12 pl-10 pr-4 outFocus"
                    autoComplete="current-password"
                    zRequired
                    [zStatus]="
                      confirmPasswordControl.invalid && confirmPasswordControl.touched
                        ? 'error'
                        : undefined
                    " />
                  <button
                    type="button"
                    (click)="showConfirmPassword = !showConfirmPassword"
                    class="absolute right-3 top-1/2 -translate-y-1/2 text-muted-foreground hover:text-foreground transition-colors cursor-pointer">
                    @if (showConfirmPassword) {
                      <svg lucideEyeOff class="h-5 w-5"></svg>
                    } @else {
                      <svg lucideEye class="h-5 w-5"></svg>
                    }
                  </button>
                </z-form-control>
                <z-form-message zType="error">{{ getConfirmPasswordError() }}</z-form-message>
              </div>
            </z-form-field>
          </div>
        </div>
        @if (isLoading()) {
          <button
            z-button
            zDisabled
            zFull
            zType="default"
            type="button"
            class="w-full h-12 text-base font-medium shadow-sm shadow-primary/25 hover:shadow-md hover:shadow-primary/30 transition-all cursor-pointer cursor-not-allowed">
            <svg lucideLoader2 class="mr-2 h-5 w-5 animate-spin"></svg>
            <span>Cambiando clave...</span>
          </button>
        } @else {
          <button
            z-button
            zFull
            zType="default"
            type="submit"
            [zDisabled]="validationForm.invalid"
            class="w-full h-12 text-base font-medium shadow-sm shadow-primary/25 hover:shadow-md hover:shadow-primary/30 transition-all cursor-pointer disabled:cursor-not-allowed">
            <svg lucideKey class="mr-2 h-5 w-5"></svg>
            <span>Cambiar Clave</span>
          </button>
        }
      </form>
    </div>
    <p class="text-center text-xs text-muted-foreground mt-6">2026 - {{ year }} Portfolio Admin</p>
  </div>
</div>
