<div class="flex flex-col justify-center items-center">
  <div class="flex">
    <img src="/img/subscribe.svg" alt="Subscripcion del usuario agregada" />
  </div>
  <div class="flex justify-center items-center flex-col">
    <h4 class="mt-3">Solicitud procesada con éxito!.</h4>
    <p class="text-sm text-600 text-center mt-1">
      ¡Hola! Tu clave ha sido cambiada con éxito. ¡Gracias por actualizar tu contraseña! Ahora
      puedes iniciar sesión con tu nueva clave.
    </p>

    <button z-button [style]="{ marginTop: '1rem' }" class="cursor-pointer" (click)="goToLogin()">
      <ng-icon name="lucideLogIn" class="mr-2 h-5 w-5" />
      Iniciar Sesión
    </button>
  </div>
</div>
